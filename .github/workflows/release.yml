# Builds the .xpi and publishes a GitHub release.
#
# Runs when a v* tag is pushed, or by hand from the Actions tab (Run workflow) with the version
# from addon/manifest.json; in that case the tag is created on the chosen commit if it does not
# exist yet. The release carries the .xpi and update.json, which Zotero reads to find updates.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (Markdown). Leave empty to use the notes generated by GitHub."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('addon/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "Tag ${{ github.ref_name }} does not match manifest version $VERSION" >&2
            exit 1
          fi

      - name: Build
        run: python3 scripts/build.py

      - name: Create tag if missing
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Claude Code for Zotero ${{ steps.version.outputs.version }}"
            git push origin "refs/tags/$TAG"
          fi

      - name: Write notes
        env:
          NOTES: ${{ inputs.notes }}
        run: printf '%s' "$NOTES" > /tmp/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/zotero-claude-code-$VERSION.xpi build/update.json --clobber --repo "$GITHUB_REPOSITORY"
          elif [ -s /tmp/notes.md ]; then
            gh release create "$TAG" build/zotero-claude-code-$VERSION.xpi build/update.json --title "$VERSION" --notes-file /tmp/notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/zotero-claude-code-$VERSION.xpi build/update.json --title "$VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
